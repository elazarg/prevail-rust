[workspace]
members = [".", "xtask"]

[package]
name = "prevail"
version = "0.1.2"
edition = "2024"
description = "eBPF Verifier using Abstract Interpretation"
license = "MIT"
repository = "https://github.com/elazarg/prevail-rust"
homepage = "https://github.com/elazarg/prevail-rust"
readme = "README.md"
keywords = ["ebpf", "bpf", "verifier", "static-analysis"]
categories = ["development-tools"]
exclude = [
    "tests/upstream/",
    "fuzz/",
    ".github/",
    "xtask/",
]
default-run = "prevail"

[lib]
path = "src/lib.rs"

[dependencies]
object = { version = "0.36", default-features = false, features = ["read", "elf"] }
regex = "1"
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "prevail"
path = "src/main.rs"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"

[profile.profiling]
inherits = "release"
debug = 1
