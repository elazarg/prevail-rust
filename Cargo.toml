[workspace]
members = [".", "xtask"]

# Idiom lints the codebase has been brought into line with. They are not on by
# default, so without this they would drift back one call site at a time.
[workspace.lints.clippy]
uninlined_format_args = "deny"
manual_let_else = "deny"

[package]
name = "prevail"
version = "0.2.6"
edition = "2024"
description = "eBPF Verifier using Abstract Interpretation"
license = "MIT"
repository = "https://github.com/elazarg/prevail-rust"
homepage = "https://github.com/elazarg/prevail-rust"
readme = "README.md"
keywords = ["ebpf", "bpf", "verifier", "static-analysis"]
categories = ["development-tools"]
exclude = [
    "tests/upstream/",
    "fuzz/",
    ".github/",
    "xtask/",
    ".claude/",
]
default-run = "prevail"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
object = { version = "0.36", default-features = false, features = ["read", "elf"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
zerocopy = { version = "0.8.39", features = ["derive"] }
fixedbitset = "0.5.7"

[[bin]]
name = "prevail"
path = "src/main.rs"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# Synthetic ELF construction for hardening tests (e.g. malformed FUNC symbols).
object = { version = "0.36", features = ["write_std"] }

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"

[profile.profiling]
inherits = "release"
debug = 1
