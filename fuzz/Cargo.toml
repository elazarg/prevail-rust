[package]
name = "prevail-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
prevail = { path = ".." }
# Synthesizing structurally-valid eBPF ELFs for fuzz_elf_build.
object = { version = "0.36", features = ["write"] }

[workspace]
members = ["."]

[[bin]]
name = "fuzz_assembler"
path = "fuzz_targets/fuzz_assembler.rs"
doc = false

[[bin]]
name = "fuzz_elf_parse"
path = "fuzz_targets/fuzz_elf_parse.rs"
doc = false

[[bin]]
name = "fuzz_unmarshal"
path = "fuzz_targets/fuzz_unmarshal.rs"
doc = false

[[bin]]
name = "fuzz_btf_parse"
path = "fuzz_targets/fuzz_btf_parse.rs"
doc = false

[[bin]]
name = "fuzz_end_to_end"
path = "fuzz_targets/fuzz_end_to_end.rs"
doc = false

[[bin]]
name = "fuzz_program"
path = "fuzz_targets/fuzz_program.rs"
doc = false

[[bin]]
name = "fuzz_elf_build"
path = "fuzz_targets/fuzz_elf_build.rs"
doc = false
